name: Test

# The unit tests, then the action itself on each platform pdf-lint has a
# release archive for, a pinned version and the newest: pdf-lint must run
# from the PATH and decode through the qpdf beside it. GitHub has no Intel
# macOS runner to try the Intel archive on: the unit tests check it's the
# one an Intel Mac takes, and pdf-lint's release workflow checks it runs.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test

  install:
    name: ${{ matrix.os }}, pdf-lint ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 and aarch64, macOS on Apple silicon, Windows x64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        version: ["0.1.0", latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        id: setup
        with:
          version: ${{ matrix.version }}
      - name: pdf-lint runs, and decodes through its qpdf
        shell: bash
        env:
          INSTALLED: ${{ steps.setup.outputs.version }}
          WANTED: ${{ matrix.version }}
          DIR: ${{ steps.setup.outputs.path }}
        run: |
          set -euo pipefail
          if [ "$WANTED" != latest ] && [ "$INSTALLED" != "$WANTED" ]; then
            echo "installed $INSTALLED, not $WANTED" >&2
            exit 1
          fi
          pdf-lint --version | tee version.txt
          grep -q "^pdf-lint $INSTALLED$" version.txt
          qpdf="$DIR/qpdf/bin/qpdf"
          if command -v cygpath >/dev/null; then qpdf=$(cygpath -u "$qpdf"); fi
          grep -q "qpdf version .*qpdf" version.txt
          # A file whose catalog and page tree are in an object stream,
          # which only qpdf decodes.
          "$qpdf" --empty --object-streams=generate "$RUNNER_TEMP/compressed.pdf"
          pdf-lint "$RUNNER_TEMP/compressed.pdf"
      # Again, from the tool cache.
      - uses: ./
        id: again
        with:
          version: ${{ steps.setup.outputs.version }}
      - name: The second install is the first
        shell: bash
        run: test "${{ steps.again.outputs.path }}" = "${{ steps.setup.outputs.path }}"
